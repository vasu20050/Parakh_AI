version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustgraph_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustgraph}
      POSTGRES_DB: ${POSTGRES_DB:-trustgraph}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trustgraph_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
